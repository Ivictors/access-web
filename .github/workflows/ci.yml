name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t access-web:ci .
      - name: Check PHP syntax
        run: |
          docker run --rm access-web:ci php -l /var/www/html/public/index.php
          docker run --rm access-web:ci php -l /var/www/html/src/bootstrap.php
          docker run --rm access-web:ci php -l /var/www/html/src/GatewayClient.php
          docker run --rm access-web:ci php -l /var/www/html/src/LoginThrottle.php
          docker run --rm access-web:ci php -l /var/www/html/src/OidcClient.php
      - name: Check login throttling
        run: docker run --rm -v "$PWD:/app:ro" -w /app access-web:ci php tests/LoginThrottleTest.php
      - name: Check HTTP login and session flow
        run: python3 tests/http_flow_test.py
